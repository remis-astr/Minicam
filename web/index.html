<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniCam</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>MiniCam</h1>
  <span id="ws-status" class="badge disconnected">Déconnecté</span>
</header>

<main>
  <section class="preview-box">
    <img id="preview" src="/preview.mjpg" alt="Preview" onerror="this.src=''">
  </section>

  <section class="controls">
    <div class="control-row">
      <label for="gain-slider">Gain <span id="gain-val">—</span></label>
      <input type="range" id="gain-slider" min="1" max="64" step="0.5" disabled>
    </div>

    <div class="control-row">
      <label for="expo-slider">Exposition <span id="expo-val">—</span></label>
      <input type="range" id="expo-slider" min="0.1" max="10000" step="0.1" disabled>
    </div>

    <div class="button-row">
      <a id="btn-capture-png" class="btn" href="/capture.png" download="capture.png">Capture PNG</a>
      <button id="btn-reconnect">Reconnecter</button>
    </div>

    <div id="status-bar">—</div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
