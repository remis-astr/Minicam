<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniCam</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>MiniCam</h1>
  <span id="ws-status" class="badge disconnected">Déconnecté</span>
</header>

<main>
  <section class="preview-box" id="preview-box">
    <img id="preview" src="/preview.mjpg" alt="Preview" onerror="this.src=''">
    <button id="btn-fullscreen" class="fullscreen-btn" title="Plein écran">⛶</button>
  </section>

  <section class="controls">
    <div class="control-row">
      <label for="gain-slider">Gain <span id="gain-val">—</span></label>
      <input type="range" id="gain-slider" min="1" max="64" step="0.5" disabled>
    </div>

    <div class="control-row">
      <label for="expo-slider">Exposition <span id="expo-val">—</span></label>
      <input type="range" id="expo-slider" min="0.1" max="10000" step="0.1" disabled>
    </div>

    <div class="control-row">
      <label for="wb-red-slider">Rouge <span id="wb-red-val">—</span></label>
      <input type="range" id="wb-red-slider" min="0.1" max="8" step="0.05" disabled>
    </div>

    <div class="control-row">
      <label for="wb-blue-slider">Bleu <span id="wb-blue-val">—</span></label>
      <input type="range" id="wb-blue-slider" min="0.1" max="8" step="0.05" disabled>
    </div>

    <div class="control-row control-row--inline">
      <label for="res-select">Résolution</label>
      <select id="res-select" disabled></select>
    </div>

    <div class="button-row">
      <a class="btn" href="/capture.png" download="capture.png">Capture PNG</a>
      <a class="btn btn-raw" href="/capture.npy" download="capture_raw.npy">Capture RAW</a>
      <button id="btn-reconnect">Reconnecter</button>
    </div>

    <div id="status-bar">—</div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
